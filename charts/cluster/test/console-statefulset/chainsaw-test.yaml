##
# Tests the correct deployment of the console StatefulSet
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: console-statefulset
spec:
  timeouts:
    apply: 1s
    assert: 10s
    cleanup: 3m
    exec: 5m
  steps:
    - name: Install a cluster with a console enabled
      try:
        - script:
            content: |
              helm upgrade \
                --install \
                --namespace $NAMESPACE \
                --values ./01-console_test_cluster.yaml \
                --wait \
                console-test ../../
        - assert:
            file: ./01-console_test_cluster-assert.yaml
        - script:
            content: |
              set -eu
              pod=console-test-cluster-console-0
              kubectl -n "$NAMESPACE" wait --for=condition=ready clusters.postgresql.cnpg.io/console-test-cluster --timeout=90s
              kubectl -n "$NAMESPACE" wait --for=condition=ready "pod/$pod" --timeout=90s
              kubectl -n "$NAMESPACE" exec "$pod" -- bash -ec '
                until command -v psql >/dev/null && psql "$DB_SUPERUSER_URI" -c "SELECT 1"; do sleep 2; done
                PGAPPNAME=console-background nohup psql "$DB_SUPERUSER_URI" -c "SELECT pg_sleep(30)" </dev/null >command.log 2>&1 &
              '
              # Observe the query from a new session after the launching exec has returned.
              kubectl -n "$NAMESPACE" exec "$pod" -- bash -ec '
                for attempt in {1..15}; do
                  if [[ $(psql "$DB_SUPERUSER_URI" -Atc "SELECT count(*) FROM pg_stat_activity WHERE application_name = \$\$console-background\$\$ AND state = \$\$active\$\$ AND wait_event = \$\$PgSleep\$\$") == 1 ]]; then exit 0; fi
                  sleep 1
                done
                exit 1
              '
    - name: Cleanup
      try:
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" scale statefulset/console-test-cluster-console --replicas=0
              kubectl -n "$NAMESPACE" wait --for=delete pod/console-test-cluster-console-0 --timeout=60s
              helm uninstall --namespace "$NAMESPACE" --wait --timeout 3m console-test
