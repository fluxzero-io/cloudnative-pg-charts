name: fork-cloudnative-pg-chart-release

on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:
    inputs:
      operator_ref:
        description: "Fluxzero cloudnative-pg ref/tag. Empty uses the latest release."
        required: false
        default: ""
      operator_image_tag:
        description: "Operator image tag to use in Chart.appVersion. Empty derives it from operator_ref."
        required: false
        default: ""
      operator_upstream_version:
        description: "Stable upstream operator version, for example v1.30.0. Empty derives it from the image tag."
        required: false
        default: ""
      upstream_chart_tag:
        description: "Upstream chart release tag. Empty selects the newest chart compatible with the operator version."
        required: false
        default: ""
      chart_suffix:
        description: "Chart suffix, for example fz.1. Empty derives it from the operator tag or next free fz.N."
        required: false
        default: ""
      target_branch:
        description: "Fork branch to release from"
        required: true
        default: "main"
      auto_merge:
        description: "Enable auto-merge on the release PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-cloudnative-pg-chart-release-${{ inputs.target_branch || 'main' }}
  cancel-in-progress: false

env:
  UPSTREAM_CHARTS_REPOSITORY: cloudnative-pg/charts
  OPERATOR_REPOSITORY: fluxzero-io/cloudnative-pg
  OPERATOR_IMAGE_REPOSITORY: ghcr.io/fluxzero-io/cloudnative-pg
  TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}

defaults:
  run:
    shell: bash

jobs:
  release-pr:
    name: Create chart release PR
    runs-on: ubuntu-24.04
    steps:
      - name: Create Fluxzero Bot installation token
        id: app-token
        env:
          APP_ID: ${{ secrets.FLUXZERO_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FLUXZERO_BOT_PRIVATE_KEY }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${APP_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
            echo "::warning::Using GITHUB_TOKEN because Fluxzero Bot secrets are not configured."
            echo "token=${FALLBACK_TOKEN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | base64url)"
          payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "${iat}" "${exp}" "${APP_ID}" | base64url)"

          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s' "${APP_PRIVATE_KEY}" > "${key_file}"

          signature="$(printf '%s.%s' "${header}" "${payload}" \
            | openssl dgst -sha256 -sign "${key_file}" -binary \
            | base64url)"
          jwt="${header}.${payload}.${signature}"

          github_api() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          installation_id="$(github_api \
            --header "Authorization: Bearer ${jwt}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/installation" \
            | jq -r '.id')"

          if [[ -z "${installation_id}" || "${installation_id}" == "null" ]]; then
            echo "::error::Could not find a Fluxzero Bot installation for ${GITHUB_REPOSITORY}."
            exit 1
          fi

          token="$(github_api \
            --request POST \
            --header "Authorization: Bearer ${jwt}" \
            "https://api.github.com/app/installations/${installation_id}/access_tokens" \
            | jq -r '.token')"

          if [[ -z "${token}" || "${token}" == "null" ]]; then
            echo "::error::Could not create a Fluxzero Bot installation token."
            exit 1
          fi

          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Checkout chart fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "cloudnative-pg chart release"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve release inputs
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_OPERATOR_REF: ${{ inputs.operator_ref || '' }}
          INPUT_OPERATOR_IMAGE_TAG: ${{ inputs.operator_image_tag || '' }}
          INPUT_OPERATOR_UPSTREAM_VERSION: ${{ inputs.operator_upstream_version || '' }}
          INPUT_UPSTREAM_CHART_TAG: ${{ inputs.upstream_chart_tag || '' }}
          INPUT_CHART_SUFFIX: ${{ inputs.chart_suffix || '' }}
        run: |
          set -euo pipefail

          operator_ref="${INPUT_OPERATOR_REF}"
          operator_image_tag="${INPUT_OPERATOR_IMAGE_TAG}"
          operator_upstream_version="${INPUT_OPERATOR_UPSTREAM_VERSION#v}"
          upstream_chart_tag="${INPUT_UPSTREAM_CHART_TAG}"
          chart_suffix="${INPUT_CHART_SUFFIX}"
          operator_image_repository="${OPERATOR_IMAGE_REPOSITORY}"

          git remote add upstream "https://github.com/${UPSTREAM_CHARTS_REPOSITORY}.git" || true
          git fetch --tags upstream

          if [[ -z "${operator_ref}" ]]; then
            operator_ref="$(gh release list \
              --repo "${OPERATOR_REPOSITORY}" \
              --json tagName,publishedAt \
              --limit 250 \
              --jq 'map(select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-fz\\.[0-9]+\\.[0-9]+$"))) | sort_by(.publishedAt) | last.tagName')"
          fi

          if [[ -z "${operator_ref}" || "${operator_ref}" == "null" ]]; then
            echo "::error::Could not resolve a Fluxzero operator ref."
            exit 1
          fi

          operator_version="${operator_ref#v}"
          if [[ -z "${operator_image_tag}" ]]; then
            operator_image_tag="${operator_version}"
          fi

          if [[ -z "${operator_upstream_version}" && "${operator_image_tag}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-fz\.[0-9]+\.[0-9]+$ ]]; then
            operator_upstream_version="${BASH_REMATCH[1]}"
          fi

          if [[ ! "${operator_upstream_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not derive a stable upstream operator version from '${operator_image_tag}'."
            exit 1
          fi

          chart_targets_operator() {
            local chart_app_version="$1"
            local newest

            [[ "${chart_app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || return 1
            [[ "${chart_app_version%.*}" == "${operator_upstream_version%.*}" ]] || return 1
            newest="$(printf '%s\n%s\n' "${chart_app_version}" "${operator_upstream_version}" | sort -V | tail -n 1)"
            [[ "${newest}" == "${operator_upstream_version}" ]]
          }

          current_chart_version="$(awk -F': *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' charts/cloudnative-pg/Chart.yaml)"
          current_upstream_chart_version="${current_chart_version%%-fz.*}"
          current_app_version="$(awk -F': *' '$1 == "appVersion" { gsub(/"/, "", $2); print $2; exit }' charts/cloudnative-pg/Chart.yaml)"

          if [[ "${current_app_version}" == "${operator_image_tag}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Chart ${current_chart_version} already uses operator ${operator_image_tag}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -n "${upstream_chart_tag}" ]]; then
            if [[ ! "${upstream_chart_tag}" =~ ^cloudnative-pg-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Expected a stable upstream chart tag, got '${upstream_chart_tag}'."
              exit 1
            fi

            candidate_app_version="$(git show "${upstream_chart_tag}:charts/cloudnative-pg/Chart.yaml" \
              | awk -F': *' '$1 == "appVersion" { gsub(/"/, "", $2); print $2; exit }')"
            if ! chart_targets_operator "${candidate_app_version}"; then
              echo "::error::Chart ${upstream_chart_tag} targets operator ${candidate_app_version}, which is incompatible with ${operator_upstream_version}."
              exit 1
            fi
          else
            while IFS= read -r candidate; do
              [[ "${candidate}" =~ ^cloudnative-pg-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              candidate_app_version="$(git show "${candidate}:charts/cloudnative-pg/Chart.yaml" \
                | awk -F': *' '$1 == "appVersion" { gsub(/"/, "", $2); print $2; exit }')"
              if chart_targets_operator "${candidate_app_version}"; then
                upstream_chart_tag="${candidate}"
                break
              fi
            done < <(git tag --list 'cloudnative-pg-v*' --sort=-version:refname)
          fi

          if [[ -z "${upstream_chart_tag}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No stable upstream chart is compatible with operator ${operator_upstream_version} yet; a scheduled run will retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          upstream_chart_version="${upstream_chart_tag#cloudnative-pg-v}"
          highest_chart_version="$(printf '%s\n%s\n' "${current_upstream_chart_version}" "${upstream_chart_version}" | sort -V | tail -n 1)"
          if [[ "${upstream_chart_version}" != "${highest_chart_version}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Refusing to move chart base backwards from ${current_upstream_chart_version} to ${upstream_chart_version}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "${chart_suffix}" ]]; then
            existing_suffixes="$(gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName \
              --limit 250 \
              --jq ".[] | .tagName | select(startswith(\"cloudnative-pg-v${upstream_chart_version}-fz.\"))" || true)"
            max=0
            while IFS= read -r release_tag; do
              [[ -z "${release_tag}" ]] && continue
              suffix_number="${release_tag##*-fz.}"
              if [[ "${suffix_number}" =~ ^[0-9]+$ && "${suffix_number}" -gt "${max}" ]]; then
                max="${suffix_number}"
              fi
            done <<< "${existing_suffixes}"
            chart_suffix="fz.$((max + 1))"
          fi

          chart_version="${upstream_chart_version}-${chart_suffix}"
          release_branch="automation/cloudnative-pg-chart-v${chart_version}"

          {
            echo "ready=true"
            echo "operator_ref=${operator_ref}"
            echo "operator_version=${operator_version}"
            echo "operator_image_tag=${operator_image_tag}"
            echo "operator_upstream_version=${operator_upstream_version}"
            echo "operator_image_repository=${operator_image_repository}"
            echo "upstream_chart_tag=${upstream_chart_tag}"
            echo "upstream_chart_version=${upstream_chart_version}"
            echo "chart_version=${chart_version}"
            echo "release_branch=${release_branch}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout operator fork
        if: steps.release.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ env.OPERATOR_REPOSITORY }}
          ref: ${{ steps.release.outputs.operator_ref }}
          path: operator
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge upstream chart release
        if: steps.release.outputs.ready == 'true'
        env:
          UPSTREAM_CHART_TAG: ${{ steps.release.outputs.upstream_chart_tag }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: |
          set -euo pipefail

          git switch -C "${RELEASE_BRANCH}" "origin/${TARGET_BRANCH}"
          if ! git merge --no-ff --no-edit "${UPSTREAM_CHART_TAG}"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            allowed_conflicts=(
              "charts/cloudnative-pg/Chart.yaml"
              "charts/cloudnative-pg/templates/crds/crds.yaml"
              "charts/cluster/test/console-statefulset/chainsaw-test.yaml"
            )

            if [[ "${#conflicts[@]}" -eq 0 ]]; then
              echo "::error::Upstream merge failed without merge conflicts."
              exit 1
            fi

            for conflict in "${conflicts[@]}"; do
              allowed=false
              for expected in "${allowed_conflicts[@]}"; do
                if [[ "${conflict}" == "${expected}" ]]; then
                  allowed=true
                  break
                fi
              done
              if [[ "${allowed}" != "true" ]]; then
                echo "::error::Unexpected upstream merge conflict: ${conflict}"
                exit 1
              fi
            done

            git checkout --theirs -- "${conflicts[@]}"
            git add -- "${conflicts[@]}"
            git commit --no-edit
          fi

      - name: Set up Helm
        if: steps.release.outputs.ready == 'true'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      - name: Set up kubectl
        if: steps.release.outputs.ready == 'true'
        uses: azure/setup-kubectl@v4

      - name: Apply Fluxzero chart release changes
        if: steps.release.outputs.ready == 'true'
        env:
          CHART_VERSION: ${{ steps.release.outputs.chart_version }}
          APP_VERSION: ${{ steps.release.outputs.operator_image_tag }}
          OPERATOR_IMAGE_REPOSITORY_RESOLVED: ${{ steps.release.outputs.operator_image_repository }}
        run: |
          set -euo pipefail

          perl -0pi -e 's/^version: ".*"$/version: "'"${CHART_VERSION}"'"/m; s/^appVersion: ".*"$/appVersion: "'"${APP_VERSION}"'"/m' \
            charts/cloudnative-pg/Chart.yaml

          perl -0pi -e 's#(^image:\n\s+repository: ).*$#${1}'"${OPERATOR_IMAGE_REPOSITORY_RESOLVED}"'#m' \
            charts/cloudnative-pg/values.yaml

          perl -0pi -e 's#(\| image\.repository \| string \| `")[^`]+("` \|)#${1}'"${OPERATOR_IMAGE_REPOSITORY_RESOLVED}"'${2}#' \
            charts/cloudnative-pg/README.md

          {
            echo '{{- if .Values.crds.create }}'
            kubectl kustomize operator/config/helm
            echo '{{- end }}'
          } > charts/cloudnative-pg/templates/crds/crds.yaml

      - name: Validate chart release
        if: steps.release.outputs.ready == 'true'
        env:
          APP_VERSION: ${{ steps.release.outputs.operator_image_tag }}
          OPERATOR_IMAGE_REPOSITORY_RESOLVED: ${{ steps.release.outputs.operator_image_repository }}
        run: |
          set -euo pipefail

          git diff --check
          helm repo add cnpg-grafana-dashboard https://cloudnative-pg.github.io/grafana-dashboards
          helm dependency build charts/cloudnative-pg
          helm lint charts/cloudnative-pg charts/cluster charts/plugin-barman-cloud
          helm template cnpg charts/cloudnative-pg >/tmp/cloudnative-pg.yaml

          grep -q 'resizeStrategy' /tmp/cloudnative-pg.yaml
          grep -q "image: \"${OPERATOR_IMAGE_REPOSITORY_RESOLVED}:${APP_VERSION}\"" /tmp/cloudnative-pg.yaml
          grep -q "value: \"${OPERATOR_IMAGE_REPOSITORY_RESOLVED}:${APP_VERSION}\"" /tmp/cloudnative-pg.yaml

      - name: Commit release changes
        if: steps.release.outputs.ready == 'true'
        id: commit
        env:
          CHART_VERSION: ${{ steps.release.outputs.chart_version }}
          OPERATOR_REF: ${{ steps.release.outputs.operator_ref }}
        run: |
          set -euo pipefail

          rm -rf operator
          git add charts/cloudnative-pg/Chart.yaml \
            charts/cloudnative-pg/README.md \
            charts/cloudnative-pg/values.yaml \
            charts/cloudnative-pg/templates/crds/crds.yaml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No chart release changes to commit."
            exit 0
          fi

          git commit -m "chore: release cloudnative-pg chart v${CHART_VERSION}" \
            -m "Operator ref: ${OPERATOR_REF}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        if: steps.release.outputs.ready == 'true' && steps.commit.outputs.changed == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: |
          git push --force-with-lease origin "${RELEASE_BRANCH}"

      - name: Create or update release PR
        if: steps.release.outputs.ready == 'true' && steps.commit.outputs.changed == 'true'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          CHART_VERSION: ${{ steps.release.outputs.chart_version }}
          OPERATOR_REF: ${{ steps.release.outputs.operator_ref }}
          OPERATOR_IMAGE_TAG: ${{ steps.release.outputs.operator_image_tag }}
          UPSTREAM_CHART_TAG: ${{ steps.release.outputs.upstream_chart_tag }}
          OPERATOR_IMAGE_REPOSITORY_RESOLVED: ${{ steps.release.outputs.operator_image_repository }}
          AUTO_MERGE: ${{ github.event_name == 'schedule' || inputs.auto_merge }}
        run: |
          title="Release cloudnative-pg chart v${CHART_VERSION}"
          body="$(cat <<EOF
          Automated Fluxzero cloudnative-pg chart release.

          Inputs:
          - Operator ref: \`${OPERATOR_REF}\`
          - Operator image: \`${OPERATOR_IMAGE_REPOSITORY_RESOLVED}:${OPERATOR_IMAGE_TAG}\`
          - Upstream chart: \`${UPSTREAM_CHART_TAG}\`
          - Chart version: \`${CHART_VERSION}\`

          This branch was validated with:
          - \`git diff --check\`
          - \`helm dependency build charts/cloudnative-pg\`
          - \`helm lint charts/cloudnative-pg charts/cluster charts/plugin-barman-cloud\`
          - \`helm template cnpg charts/cloudnative-pg\`
          - rendered checks for \`resizeStrategy\` and the Fluxzero operator image
          EOF
          )"

          pr_number="$(gh api \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${RELEASE_BRANCH}" \
            -f "base=${TARGET_BRANCH}" \
            -f "state=open" \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            --jq '.[0].number // empty')"

          if [[ -z "${pr_number}" ]]; then
            pr_number="$(jq -n \
              --arg title "${title}" \
              --arg head "${RELEASE_BRANCH}" \
              --arg base "${TARGET_BRANCH}" \
              --arg body "${body}" \
              '{title: $title, head: $head, base: $base, body: $body, maintainer_can_modify: true}' \
              | gh api \
                  --method POST \
                  --header "Accept: application/vnd.github+json" \
                  --input - \
                  "repos/${GITHUB_REPOSITORY}/pulls" \
                  --jq '.number')"
          else
            jq -n \
              --arg title "${title}" \
              --arg body "${body}" \
              --arg base "${TARGET_BRANCH}" \
              '{title: $title, body: $body, base: $base}' \
              | gh api \
                  --method PATCH \
                  --header "Accept: application/vnd.github+json" \
                  --input - \
                  "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" >/dev/null
          fi

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
            -f labels[]=release >/dev/null

          if [[ "${AUTO_MERGE}" == "true" ]]; then
            previous_check_count=-1
            stable_samples=0

            for _ in {1..24}; do
              check_count="$(gh pr view "${pr_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json statusCheckRollup \
                --jq '.statusCheckRollup | length')"

              if (( check_count > 0 && check_count == previous_check_count )); then
                stable_samples=$((stable_samples + 1))
              else
                stable_samples=0
              fi

              if (( stable_samples >= 2 )); then
                break
              fi

              previous_check_count="${check_count}"
              sleep 5
            done

            if (( check_count == 0 || stable_samples < 2 )); then
              echo "::error::Timed out waiting for checks to register on PR #${pr_number}."
              exit 1
            fi

            gh pr checks "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --watch \
              --fail-fast \
              --interval 10
            gh pr merge "${pr_number}" --repo "${GITHUB_REPOSITORY}" --merge
          fi
